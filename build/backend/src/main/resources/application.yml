spring:
  application:
    name: bitdance-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitdance?currentSchema=bitdance}
    username: ${SPRING_DATASOURCE_USERNAME:bitdance}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:8000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:3000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:300000}
      data-source-properties:
        connectTimeout: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:5}
        socketTimeout: ${POSTGRES_SOCKET_TIMEOUT_SECONDS:10}
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: bitdance
        jdbc.time_zone: Asia/Shanghai
        format_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2s
  jackson:
    time-zone: Asia/Shanghai
  cache:
    type: ${BITDANCE_CACHE_TYPE:simple}
    cache-names:
      - studio:detail
      - review:summary
      - practice:square
      - community:feed:recommend

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

bitdance:
  dev:
    seed-account: ${BITDANCE_DEV_SEED_ACCOUNT:false}
    seed-account-phone: ${BITDANCE_DEV_SEED_ACCOUNT_PHONE:18511695975}
    seed-account-password: ${BITDANCE_DEV_SEED_ACCOUNT_PASSWORD:123456}
  jwt:
    secret: ${BITDANCE_JWT_SECRET:dev-secret-please-override-in-prod-at-least-32-bytes-long}
    access-ttl-minutes: 60
    refresh-ttl-days: 14
  wechat:
    app-id: ${BITDANCE_WECHAT_APP_ID:}
    app-secret: ${BITDANCE_WECHAT_APP_SECRET:}
    redirect-uri: ${BITDANCE_WECHAT_REDIRECT_URI:}
    scope: ${BITDANCE_WECHAT_SCOPE:snsapi_userinfo}
    frontend-callback-uri: ${BITDANCE_WECHAT_FRONTEND_CALLBACK_URI:http://localhost:5173/#/login}
    auto-create-user: ${BITDANCE_WECHAT_AUTO_CREATE_USER:false}
  sms:
    mock: ${BITDANCE_SMS_MOCK:true}
    provider: ${BITDANCE_SMS_PROVIDER:aliyun}
    storage: ${BITDANCE_SMS_STORAGE:memory}
    fixed-code: ${BITDANCE_SMS_FIXED_CODE:123456}
    cooldown-seconds: ${BITDANCE_SMS_COOLDOWN_SECONDS:60}
    ttl-minutes: ${BITDANCE_SMS_TTL_MINUTES:5}
    aliyun:
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      template-param-name: ${ALIYUN_SMS_TEMPLATE_PARAM_NAME:code}
      template-min-param-name: ${ALIYUN_SMS_TEMPLATE_MIN_PARAM_NAME:min}
      connect-timeout-ms: ${ALIYUN_SMS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ALIYUN_SMS_READ_TIMEOUT_MS:10000}
    aliyun-pnvs:
      endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
      access-key-id: ${ALIYUN_PNVS_ACCESS_KEY_ID:${ALIYUN_SMS_ACCESS_KEY_ID:}}
      access-key-secret: ${ALIYUN_PNVS_ACCESS_KEY_SECRET:${ALIYUN_SMS_ACCESS_KEY_SECRET:}}
      sign-name: ${ALIYUN_PNVS_SIGN_NAME:${ALIYUN_SMS_SIGN_NAME:}}
      template-code: ${ALIYUN_PNVS_TEMPLATE_CODE:${ALIYUN_SMS_TEMPLATE_CODE:}}
      template-param-name: ${ALIYUN_PNVS_TEMPLATE_PARAM_NAME:${ALIYUN_SMS_TEMPLATE_PARAM_NAME:code}}
      template-min-param-name: ${ALIYUN_PNVS_TEMPLATE_MIN_PARAM_NAME:${ALIYUN_SMS_TEMPLATE_MIN_PARAM_NAME:min}}
      code-placeholder: ${ALIYUN_PNVS_CODE_PLACEHOLDER:##code##}
      country-code: ${ALIYUN_PNVS_COUNTRY_CODE:86}
      code-length: ${ALIYUN_PNVS_CODE_LENGTH:6}
      code-type: ${ALIYUN_PNVS_CODE_TYPE:1}
      case-auth-policy: ${ALIYUN_PNVS_CASE_AUTH_POLICY:1}
      duplicate-policy: ${ALIYUN_PNVS_DUPLICATE_POLICY:1}
      auto-retry: ${ALIYUN_PNVS_AUTO_RETRY:1}
      return-verify-code: ${ALIYUN_PNVS_RETURN_VERIFY_CODE:false}
      scheme-name: ${ALIYUN_PNVS_SCHEME_NAME:}
      connect-timeout-ms: ${ALIYUN_PNVS_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${ALIYUN_PNVS_READ_TIMEOUT_MS:10000}
      call-timeout-ms: ${ALIYUN_PNVS_CALL_TIMEOUT_MS:15000}
      max-attempts: ${ALIYUN_PNVS_MAX_ATTEMPTS:2}
      retry-backoff-ms: ${ALIYUN_PNVS_RETRY_BACKOFF_MS:300}
  maps:
    tencent:
      # M1 腾讯地图 WebService Key 只在后端读取；真实值放环境变量或 application-local.yml。
      key: ${BITDANCE_TENCENT_MAP_KEY:}
      base-url: ${BITDANCE_TENCENT_MAP_BASE_URL:https://apis.map.qq.com}
      referer: ${BITDANCE_TENCENT_MAP_REFERER:BitDance}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      # 5173 被其他本地服务占用时，Vite 会使用 5174 作为联调端口。
      - http://localhost:5174
      - http://127.0.0.1:5174
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://192.168.*.*:5173
      - http://192.168.*.*:5174
      - http://192.168.*.*:5175
      - http://10.*.*.*:5173
      - http://10.*.*.*:5174
      - http://10.*.*.*:5175

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.bitdance: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
