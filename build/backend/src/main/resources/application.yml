spring:
  application:
    name: bitdance-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitdance?currentSchema=bitdance}
    username: ${SPRING_DATASOURCE_USERNAME:bitdance}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: bitdance
        jdbc.time_zone: Asia/Shanghai
        format_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2s
  jackson:
    time-zone: Asia/Shanghai
  cache:
    type: ${BITDANCE_CACHE_TYPE:simple}
    cache-names:
      - studio:detail
      - review:summary
      - practice:square
      - community:feed:recommend

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

bitdance:
  jwt:
    secret: ${BITDANCE_JWT_SECRET:dev-secret-please-override-in-prod-at-least-32-bytes-long}
    access-ttl-minutes: 60
    refresh-ttl-days: 14
  sms:
    mock: ${BITDANCE_SMS_MOCK:true}
    fixed-code: "123456"
    cooldown-seconds: 60
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      # 5173 被其他本地服务占用时，Vite 会使用 5174 作为联调端口。
      - http://localhost:5174
      - http://127.0.0.1:5174

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.bitdance: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
